name: Verify Erdos 758 proof
on:
  push:
    branches: [verify-erdos758]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          repository: google-deepmind/formal-conjectures
          ref: d9c9d8ea1b3b1f2e617fd5e449bdda120872bbd3
          path: project
      - uses: actions/checkout@v4
        with:
          repository: plby/lean-proofs
          ref: 8822f7ddef30fadbd92e1c6ab4ed897af356af5e
          path: candidate
          sparse-checkout: |
            src/latest/ErdosProblems/Erdos758
            src/latest/ErdosProblems/Erdos758.lean
      - name: Prepare exact candidate proof
        run: |
          mkdir -p project/ErdosProblems
          cp -r candidate/src/latest/ErdosProblems/Erdos758 project/ErdosProblems/
          cp candidate/src/latest/ErdosProblems/Erdos758.lean project/ErdosProblems/
          cat >> project/lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "ErdosProblems"
          [lean_lib.leanOptions]
          autoImplicit = true
          weak.linter.style.copyright.formalConjectures = false
          weak.linter.style.namespace = false
          weak.linter.style.stubs = false
          EOF
          printf 'import ErdosProblems.Erdos758\n#print axioms Erdos758.erdos_758\n#print axioms Erdos758.every_graph_on_twelve_colorable_four\n' > project/Audit758.lean
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: project
          build-args: ErdosProblems.Erdos758.D12.Semantic
          test: false
          lint: false
      - name: Compile certificate cases sequentially
        working-directory: project
        run: |
          for source in ErdosProblems/Erdos758/D12/Cases/*.lean; do
            module="${source%.lean}"
            module="${module//\//.}"
            lake build "$module"
          done
          lake build ErdosProblems.Erdos758
      - name: Audit final proof axioms
        working-directory: project
        run: lake env lean Audit758.lean

      - name: Verify upstream statement and exact proof bridge
        working-directory: project
        run: |
          cp ../harness/Statement758.lean FormalConjectures/ErdosProblems/758.lean
          lake build FormalConjectures.ErdosProblems.«758»
          cp ../harness/ExactStatement758.lean ExactStatement758.lean
          lake env lean ExactStatement758.lean
