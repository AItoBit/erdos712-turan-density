name: Build and audit Erdos 712
on:
  push:
    branches: [lean-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build-args: 'Challenge Solution'
          test: false
          lint: false
      - name: Audit theorem axioms
        run: lake env lean Audit.lean
